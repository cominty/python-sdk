[project]
name = "cominty-sdk"
version = "0.5.0"
description = "Official async Python client for the Cominty managed agent chat API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cominty" }]
keywords = ["cominty", "sdk", "agent", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typing-extensions>=4.6",
    # Lets Pydantic evaluate `X | Y` unions and `list[str]` subscripts in model
    # field annotations on Python < 3.10, where `|` isn't valid at runtime.
    # Pydantic auto-detects and uses it. See AGENTS.md §1.
    "eval-type-backport>=0.2; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/cominty/python-sdk"
Repository = "https://github.com/cominty/python-sdk"
Issues = "https://github.com/cominty/python-sdk/issues"
Changelog = "https://github.com/cominty/python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "jupyter>=1.0",
    "nbformat>=5",
    "invoke>=2.2",
    "twine>=5",
    "rich>=13",  # examples/ pretty output, tasks.py release confirmation prompts
    "packaging>=23",  # tasks.py release: PEP 440 / SemVer version parsing
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cominty_sdk"]

[tool.hatch.build.targets.sdist]
only-include = ["src/cominty_sdk", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # so tests/test_release.py can `import tasks` (repo-root script)
markers = [
    "integration: opt-in tests requiring COMINTY_API_KEY",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
# Only single-dot, same-package relative imports (`from .foo import Bar`) are
# allowed. Anything reaching into a parent package (`from ..foo import Bar`)
# must be an absolute import instead.
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Unshipped dev entrypoints (excluded from the sdist): manual endpoint-poking
# scripts and the invoke task runner. Real lint (unused imports, bugs) still
# applies, but full type annotations are needless ceremony here: invoke tasks
# idiomatically take an unannotated Context.
"tasks.py" = ["ANN"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
include = ["src/cominty_sdk"]

[tool.coverage.run]
source = ["src/cominty_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Type-only imports; never executed at runtime.
    "if TYPE_CHECKING:",
]
